[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physguard"
version = "0.2.1"
description = "Verify LLM numerical answers with units, physical laws and sanity bounds."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pint>=0.24", "pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
